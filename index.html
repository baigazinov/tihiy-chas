<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Санаторий «Тихий час»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans:wght@400;700&family=Rubik+Mono+One&display=swap">
<style>
/* Layout: a night ward. Header bar, one central stage, a roster strip of patients at the foot. Phones get a single tall column of big buttons. */
:root{
  --bg:#0b1512; --wall:#12211c; --tile:rgba(143,209,181,.045); --line:rgba(143,209,181,.18);
  --fg:#e2eee7; --muted:#8aa79b; --mint:#8fd1b5; --mint-deep:#3f7d66;
  --paper:#ebe4cf; --ink:#211d16; --ink-muted:#6f6654;
  --blood:#e0503a; --amber:#e9b44c; --good:#7fd69b;
  --f-display:"Rubik Mono One","Arial Black",Impact,sans-serif;
  --f-body:"PT Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px);background-size:44px 44px}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* buttons */
.btn{appearance:none;border:0;border-radius:6px;background:var(--mint);color:#0b1512;font-weight:700;padding:12px 18px;cursor:pointer;transition:transform .08s,filter .15s;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.ans:focus-visible,.pillbtn:focus-visible,.ft:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:16px 22px;width:100%}
.btn.sm{font-size:14px;padding:8px 12px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:var(--blood);color:#fff}
input,select{background:#0e1b17;border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%;font-size:18px}
input::placeholder{color:#5d776c}

/* menu */
.sign{font-family:var(--f-display);font-size:clamp(28px,6vw,64px);line-height:1.02;color:var(--mint);text-shadow:0 0 18px rgba(143,209,181,.35);letter-spacing:-.01em}
.sign span{display:block;color:var(--fg);text-shadow:none}
.flicker{animation:flick 7s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.hero{display:grid;gap:16px;padding-block:24px 4px}
.lede{max-width:62ch;font-size:18px;color:#c7d8cf}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.door{background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.door h3{font-family:var(--f-display);font-size:20px;font-weight:400}
.door label{font-size:14px;color:var(--muted);margin-bottom:-6px}
.err{color:var(--blood);min-height:1.4em;font-size:15px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;border-top:1px dashed var(--line);padding-top:20px}
.rule{display:flex;gap:12px}
.rule b{font-family:var(--f-mono);color:var(--mint);font-size:13px;padding-top:2px}
.rule p{color:#c7d8cf;font-size:15px}
.status{font-size:14px;color:var(--muted)}
.status.bad{color:var(--amber)}

/* host bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font-family:var(--f-display);font-size:15px;color:var(--mint);display:flex;align-items:center;gap:10px}
.cross{width:18px;height:18px;position:relative;flex:none}
.cross::before,.cross::after{content:"";position:absolute;background:var(--blood);border-radius:1px}
.cross::before{left:6px;top:0;width:6px;height:18px}.cross::after{top:6px;left:0;height:6px;width:18px}
.bar-mid{flex:1;min-width:0;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.code-chip{font-family:var(--f-mono);font-size:14px;background:var(--wall);border:1px solid var(--line);padding:6px 10px;border-radius:6px}
.code-chip b{font-size:18px;color:var(--amber);letter-spacing:.12em}

/* doctor */
.doc{display:flex;gap:14px;align-items:flex-start}
.doc svg{flex:none;width:64px;height:64px}
.doc-say{background:var(--wall);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 16px;font-size:clamp(16px,2vw,20px);max-width:70ch;min-width:0}
.doc-name{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint);margin-bottom:4px}

/* paper card */
.paper{background:var(--paper);color:var(--ink);border-radius:4px;padding:clamp(18px,3vw,32px);position:relative;box-shadow:0 18px 40px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(33,29,22,.07) 31px 32px)}
.paper-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);border-bottom:1px solid rgba(33,29,22,.25);padding-bottom:8px;margin-bottom:18px}
.stamp{position:absolute;right:22px;top:58px;font-family:var(--f-display);font-size:13px;color:var(--blood);border:2px solid var(--blood);padding:4px 8px;transform:rotate(-6deg);opacity:.85;border-radius:3px}
.q{font-family:var(--f-body);font-weight:700;font-size:clamp(22px,3.4vw,40px);line-height:1.15;max-width:28ch;padding-right:90px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:22px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid rgba(33,29,22,.35);border-radius:6px;padding:12px 14px;min-height:62px;font-size:clamp(17px,2vw,22px);min-width:0}
.opt .let{font-family:var(--f-display);font-size:16px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);flex:none}
.opt .ot{flex:1;min-width:0}
.opt.right{background:#cfe8d3;border-color:#2f7a47}
.opt.right .let{background:#2f7a47}
.opt.wrong{opacity:.55}
.pickers{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.note{margin-top:16px;font-size:16px;color:var(--ink-muted);font-style:italic}

/* timer */
.timer-row{display:flex;align-items:center;gap:12px}
.timer{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--mint);transform-origin:left;transition:transform .2s linear,background .3s}
.timer i.warn{background:var(--blood)}
.secs{font-family:var(--f-mono);font-size:20px;min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}

/* tokens */
.tok{--c:#8fd1b5;width:34px;height:34px;border-radius:50%;background:var(--c);color:#0b1512;display:inline-grid;place-items:center;font-family:var(--f-display);font-size:13px;flex:none;position:relative}
.tok.sm{width:24px;height:24px;font-size:10px}
.tok.ghost{background:transparent;color:var(--c);border:2px dashed var(--c);opacity:.75}
.tok.dead{background:transparent;color:var(--blood);border:2px solid var(--blood)}

/* roster */
.roster{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.rp{display:flex;align-items:center;gap:8px;background:var(--wall);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:15px;min-width:0}
.rp .nm{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp .st{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rp.done{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}
.rp .chk{width:16px;text-align:center;color:var(--mint);font-weight:700}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.code-box{background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:12px}
.code-big{font-family:var(--f-display);font-size:clamp(64px,14vw,150px);line-height:1;color:var(--amber);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.side{display:grid;gap:14px}
.lob-list{display:flex;flex-direction:column;gap:8px;min-height:60px}
.lob-row{display:flex;align-items:center;gap:10px;background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.lob-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inline label{font-size:15px;color:var(--muted)}
.inline select{width:auto;font-size:16px;padding:8px 10px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:15px}

/* procedure */
.proc{background:var(--wall);border:1px solid var(--line);border-left:4px solid var(--blood);border-radius:6px;padding:clamp(18px,3vw,28px);display:grid;gap:14px}
.proc-name{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,48px);color:var(--blood)}
.proc-rule{font-size:clamp(17px,2vw,21px);max-width:60ch}
.who{display:flex;flex-wrap:wrap;gap:10px}
.who .rp{background:#1a0f0d;border-color:rgba(224,80,58,.4)}
.tray{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.pillwrap{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px}
.pill{width:64px;height:30px;border-radius:15px;background:linear-gradient(90deg,var(--paper) 0 50%,var(--mint) 50% 100%);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pill.poison{background:linear-gradient(90deg,var(--paper) 0 50%,var(--blood) 50% 100%)}
.pill-n{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.pill-tag{font-family:var(--f-display);font-size:11px;color:var(--blood)}
.res-list{display:grid;gap:8px}
.res-row{display:flex;align-items:center;gap:10px;font-size:18px;flex-wrap:wrap}
.res-row .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;margin-left:auto}
.verdict{font-family:var(--f-display);font-size:clamp(18px,3vw,28px);line-height:1.2}
.verdict.dead{color:var(--blood)}
.verdict.safe{color:var(--good)}
.big-num{font-family:var(--f-display);font-size:clamp(40px,8vw,80px);color:var(--amber);line-height:1}

/* final track */
.track{display:grid;gap:10px;background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:16px}
.lane{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr);gap:12px;align-items:center}
.lane-name{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px}
.lane-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run{position:relative;height:38px}
.cells{position:absolute;inset:0 44px 0 0;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.cells i{background:rgba(143,209,181,.07);border-radius:3px}
.exit{position:absolute;right:0;top:0;bottom:0;width:40px;display:grid;place-items:center;background:var(--good);color:#0b1512;font-family:var(--f-display);font-size:8px;border-radius:4px;writing-mode:vertical-rl;transform:rotate(180deg)}
.runner{position:absolute;top:2px;left:calc(var(--p) / 10 * (100% - 78px));transition:left .9s cubic-bezier(.3,1.4,.5,1)}
.move{font-family:var(--f-mono);font-size:13px;color:var(--good);margin-left:6px}
.move.zero{color:var(--muted)}
.fopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}

/* winner */
.winner{display:grid;gap:12px;justify-items:start}
.winner .tok{width:80px;height:80px;font-size:28px}
.wname{font-family:var(--f-display);font-size:clamp(28px,6vw,60px);color:var(--good);line-height:1.05;overflow-wrap:anywhere}
table.stand{border-collapse:collapse;width:100%;font-size:16px}
.stand td,.stand th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.stand th{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:400}
.stand td.n{font-variant-numeric:tabular-nums;text-align:right}
.tablebox{overflow-x:auto}

/* phone */
.phone{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.pbar .nm{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:rgba(127,214,155,.15);color:var(--good)}
.badge.ghost{background:rgba(224,80,58,.15);color:var(--blood)}
.pcard{background:var(--wall);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
.pq{font-size:19px;font-weight:700;line-height:1.3}
.ans-list{display:grid;gap:10px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:62px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--line);background:#0e1b17;font-size:18px;cursor:pointer}
.ans .let{font-family:var(--f-display);font-size:14px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#0b1512;flex:none}
.ans:active{background:#16302a}
.ft.on{border-color:var(--amber);background:#2a2412}
.ft.on .let{background:var(--amber)}
.big-msg{font-family:var(--f-display);font-size:clamp(24px,7vw,36px);line-height:1.1}
.big-msg.good{color:var(--good)}.big-msg.bad{color:var(--blood)}
.pills-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}
.pillbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:10px;border:1.5px solid var(--line);background:#0e1b17;cursor:pointer}
.mathbox{display:grid;gap:12px;text-align:center}
.prob{font-family:var(--f-display);font-size:clamp(34px,10vw,52px);font-variant-numeric:tabular-nums}
.mform{display:flex;gap:10px}
.mform input{font-size:26px;text-align:center;font-family:var(--f-mono)}
.mform.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.qr{background:#fff;padding:8px;border-radius:8px;width:min(220px,100%)}
.qr svg{display:block;width:100%;height:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;max-width:calc(100% - 32px)}
.fade{animation:fadein .4s ease-out}
@keyframes fadein{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.flicker,.fade,.mform.shake{animation:none}.runner,.timer i{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>

<div id="app"></div>
<div id="toast" hidden></div>

/* ---------- хост ---------- */
function hostView(){
  const G=S.HG,P=G.P||{};
  let mid='';
  if(G.phase==='question'||G.phase==='reveal')mid=`Вопрос ${G.qn} из ${G.rounds}`;
  else if(G.phase.startsWith('trial'))mid='Процедурная';
  else if(G.phase.startsWith('final'))mid='Финал · побег';
  else if(G.phase==='lobby')mid='Сбор пациентов';
  const bar=`<header class="bar"><div class="brand"><span class="cross"></span>Тихий час</div><div class="bar-mid">${mid}</div><span id="net" class="badge ghost" ${S.net?'hidden':''}>нет связи</span><div class="code-chip">Палата <b>${esc(S.code)}</b></div><button class="btn sm ghost" data-act="exit">${S.exitArm?'Точно закрыть?':'Закрыть палату'}</button></header>`;
  let body='';
  switch(G.phase){
    case 'lobby':body=hostLobby();break;
    case 'intro':body=`${doc(G.quip)}<div class="proc"><div class="label">Распорядок</div><div class="res-list" style="font-size:18px">
      <p>${G.rounds} ${plural(G.rounds,'вопрос','вопроса','вопросов')} по 20 секунд. Отвечайте с телефонов.</p>
      <p>Ошибся или промолчал, значит идёшь на процедуру. Не все возвращаются.</p>
      <p>Призраки отвечают дальше и в финале могут ожить.</p></div>${timerRow()}</div>`;break;
    case 'question':case 'reveal':body=hostQuestion();break;
    case 'trialIntro':case 'trial':case 'trialResult':body=hostTrial();break;
    case 'finalIntro':body=`${doc(G.quip)}<div class="proc" style="border-left-color:var(--good)"><div class="label">Финал</div><h2 class="proc-name" style="color:var(--good)">Побег</h2>
      <p class="proc-rule">Выход в ${LEN} шагах. Живые стартуют с ${START}-й клетки, призраки с нуля. На экране категория и три варианта: выберите все подходящие. Каждый верный даёт шаг вперёд, каждый лишний отнимает шаг. Призрак, обогнавший последнего живого, оживает. Первый живой у выхода побеждает.</p>${timerRow()}</div>${track()}`;break;
    case 'finalQ':case 'finalReveal':body=hostFinal();break;
    case 'over':body=hostOver();break;
  }
  const foot=['lobby','over'].includes(G.phase)?'':`<footer class="roster" id="roster"></footer>`;
  return `<div class="wrap">${bar}${body}${foot}</div>`;
}
function hostLobby(){
  const G=S.HG;
  return `${doc(G.quip||QUIPS.lobby[0])}
  <section class="lobby">
    <div class="code-box">
      <div class="label">Код палаты</div>
      <div class="code-big">${esc(S.code)}</div>
      <p style="font-size:18px">Наведи камеру телефона на QR-код или открой эту же ссылку, выбери «Я пациент» и введи код.</p>

    </div>
    <div class="side">
      <div class="label">Пациенты <span id="pcount"></span></div>
      <div class="lob-list" id="loblist"></div>
      <div class="inline"><label for="rounds">Вопросов до финала</label>
        <select id="rounds">${[5,8,10,12].map(n=>`<option value="${n}" ${G.rounds===n?'selected':''}>${n}</option>`).join('')}</select>
        <button class="btn sm ghost" data-act="addbot">+ Бот для пробы</button></div>
      <button class="btn big" data-act="start" id="startbtn" disabled>Начать приём</button>

function lobbyPeople(){
  const G=S.HG;
  const real=Object.entries(S.players).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0)).map(([id,p])=>({id,name:p.name||'Без имени',bot:false}));
  return real.concat((G.bots||[]).map(b=>({id:b.id,name:b.name,bot:true})));
}
function hostQuestion(){
  const G=S.HG,P=G.P,rev=G.phase==='reveal'?G.rev:null;
  const opts=G.q.o.map((o,i)=>{
    let cls='',pk='';
    if(rev){cls=i===rev.a?'right':'wrong';pk=Object.keys(P).filter(id=>rev.picks[id]===i).map(id=>tok(id,P,'sm')).join('')}
    return `<div class="opt ${cls}"><span class="let">${LET[i]}</span><span class="ot">${esc(o)}</span><span class="pickers">${pk}</span></div>`}).join('');
  let after='';
  if(rev){
    const silent=Object.keys(P).filter(id=>rev.picks[id]===null||rev.picks[id]===undefined);
    after=`${rev.note?`<p class="note">${esc(rev.note)}</p>`:''}${silent.length?`<p class="note">Промолчали: ${esc(names(silent,P))}</p>`:''}`;
  }
  const verdict=rev?(G.doomed.length?`<p class="verdict dead fade">В процедурную: ${esc(names(G.doomed,P))}</p>`:`<p class="verdict safe fade">Все живые в безопасности</p>`):'';
  return `${doc(G.quip)}
  <div class="paper fade"><div class="paper-head"><span>Анкета пациента</span><span>Вопрос ${G.qn} / ${G.rounds}</span></div>
    <span class="stamp">${G.q.c==='kz'?'Казахстан':'Эрудиция'}</span>
    <h2 class="q">${esc(G.q.t)}</h2><div class="opts">${opts}</div>${after}</div>
  ${verdict}${timerRow()}`;
}
function pillsTray(t,res){
  let h='';
  for(let i=0;i<t.k;i++){
    const poison=res&&res.poison.includes(i);
    const pk=res?t.who.filter(id=>res.detail[id]&&res.detail[id].v===i).map(id=>tok(id,S.HG.P,'sm')).join(''):'';
    h+=`<div class="pillwrap"><div class="pill ${poison?'poison':''}"></div><span class="pill-n">№${i+1}</span>${poison?'<span class="pill-tag">ЯД</span>':''}<div class="pickers">${pk}</div></div>`;
  }
  return `<div class="tray">${h}</div>`;
}
function hostTrial(){
  const G=S.HG,P=G.P,t=G.trial,T=TRIALS[t.type],res=G.phase==='trialResult'?G.tres:null;
  let inner='';
  if(t.type==='pills')inner=pillsTray(t,res);
  if(t.type==='guess')inner=`<p class="pq" style="font-size:clamp(20px,3vw,30px)">${esc(t.gt)}</p>`;
  if(t.type==='math'&&!res)inner=`<div class="res-list">${t.who.map(id=>`<div class="res-row">${chip(id,P)}<span class="v" data-mc="${id}">0</span></div>`).join('')}</div>`;
  if(res&&t.type==='math')inner=`<div class="res-list">${t.who.slice().sort((a,b)=>res.detail[b].v-res.detail[a].v).map(id=>`<div class="res-row">${chip(id,P)}<span class="v">${res.detail[id].v} ${plural(res.detail[id].v,'пример','примера','примеров')}</span></div>`).join('')}</div>`;
  if(res&&t.type==='guess')inner+=`<div class="label">Правильный ответ</div><div class="big-num">${res.ans}</div><div class="res-list">${t.who.slice().sort((a,b)=>(res.detail[a].d??1e12)-(res.detail[b].d??1e12)).map(id=>{const d=res.detail[id];return `<div class="res-row">${chip(id,P)}<span class="v">${d.v===null?'молчание':`${d.v} (мимо на ${d.d})`}</span></div>`}).join('')}</div>`;
  let verdict='';
  if(res){
    if(res.spared)verdict=`<p class="verdict safe">Все должны были умереть, но главврач передумал. Пока что.</p>`;
    else if(res.dead.length)verdict=`<p class="verdict dead">Выписаны на тот свет: ${esc(names(res.dead,P))}</p>`;
    else verdict=`<p class="verdict safe">Все пережили процедуру</p>`;
  }
  return `${doc(G.quip)}
  <div class="proc fade"><div class="label">Процедурная · ${G.phase==='trialIntro'?'назначение':G.phase==='trial'?'идёт процедура':'итог'}</div>
    <h2 class="proc-name">${T.name}</h2>
    ${G.phase!=='trialResult'?`<p class="proc-rule">${esc(T.rule(t))}</p>`:''}
    <div class="who">${t.who.map(id=>chip(id,P)).join('')}</div>
    ${G.phase!=='trialIntro'?inner:''}${verdict}${timerRow()}</div>`;
}
function track(prev){
  const G=S.HG,P=G.P;
  const ids=Object.keys(P).sort((a,b)=>P[b].pos-P[a].pos||(P[b].alive-P[a].alive));
  return `<div class="track">${ids.map(id=>{const p=P[id];const from=prev?Math.max(0,p.pos-(prev[id]||0)):p.pos;const mv=prev?`<span class="move ${prev[id]?'':'zero'}">+${prev[id]||0}</span>`:'';
    return `<div class="lane"><div class="lane-name">${tok(id,P,'sm')}<span>${esc(p.name)}</span>${mv}</div><div class="run"><div class="cells">${'<i></i>'.repeat(LEN)}</div><div class="runner" style="--p:${from}" ${prev?`data-to="${p.pos}"`:''}>${tok(id,P)}</div><div class="exit">ВЫХОД</div></div></div>`}).join('')}</div>`;
}
function hostFinal(){
  const G=S.HG,P=G.P,rev=G.phase==='finalReveal'?G.frev:null;
  const opts=G.fin.o.map((o,i)=>{let cls='',pk='';if(rev){cls=rev.c.includes(i)?'right':'wrong';pk=Object.keys(P).filter(id=>(rev.picks[id]||[]).includes(i)).map(id=>tok(id,P,'sm')).join('')}
    return `<div class="opt ${cls}"><span class="let">${LET[i]}</span><span class="ot">${esc(o)}</span><span class="pickers">${pk}</span></div>`}).join('');
  const rv=rev&&rev.revived.length?`<p class="verdict safe fade">Ожили: ${esc(names(rev.revived,P))}</p>`:'';
  return `${doc(G.quip)}
  <div class="paper fade"><div class="paper-head"><span>Побег · отметьте всё подходящее</span><span>Вопрос финала ${G.fn}</span></div>
    <h2 class="q" style="padding-right:0">${esc(G.fin.t)}</h2><div class="fopts">${opts}</div></div>
  ${rv}${timerRow()}${track(rev?rev.moves:null)}`;
}
function standings(){
  const P=S.HG.P,w=S.HG.winner;
  const ids=Object.keys(P).sort((a,b)=>(b===w)-(a===w)||(P[b].alive-P[a].alive)||P[b].pos-P[a].pos||P[b].score-P[a].score);
  return ids;
}
function hostOver(){
  const G=S.HG,P=G.P,w=G.winner;
  const ids=standings();
  return `${doc(w?QUIPS.finalWin[0]+' '+QUIPS.over[0]:'Никто не выписался. Палата остаётся за мной.')}
  ${w?`<section class="winner fade"><div class="label">Выписан живым</div>${tok(w,P)}<div class="wname">${esc(P[w].name)}</div></section>`:''}
  <div class="tablebox"><table class="stand"><thead><tr><th>#</th><th>Пациент</th><th>Статус</th><th style="text-align:right">Шагов</th><th style="text-align:right">Очки</th></tr></thead><tbody>
  ${ids.map((id,i)=>`<tr><td class="n">${i+1}</td><td><span class="inline">${tok(id,P,'sm')} ${esc(P[id].name)}</span></td><td>${id===w?'Выписан':P[id].alive?'Остался в палате':'Призрак'}</td><td class="n">${P[id].pos}</td><td class="n">${P[id].score}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="inline"><button class="btn" data-act="again">Новый заезд с теми же пациентами</button></div>`;
}

/* ---------- телефон ---------- */
function phoneView(){
  const G=S.G;
  const me=G&&G.P&&G.P[S.uid];
  const color=me?COLORS[me.c%COLORS.length]:'#8fd1b5';
  const bar=`<header class="pbar"><span class="tok sm ${me&&!me.alive?'ghost':''}" style="--c:${color}">${esc((S.my.name||'?').charAt(0).toUpperCase())}</span><span class="nm">${esc(S.my.name)}</span>${me?`<span class="badge ${me.alive?'':'ghost'}">${me.alive?'Жив':'Призрак'}</span>`:''}<span id="net" class="badge ghost" ${S.net?'hidden':''}>нет связи</span><span class="label">#${esc(S.code)}</span><button class="btn sm ghost" data-act="exit">${S.exitArm?'Точно?':'Выйти'}</button></header>`;
  let body='';
  if(!G)body=`<div class="pcard"><p class="big-msg">Палата закрыта</p><p class="muted">Главврач завершил игру или она ещё не загрузилась.</p><button class="btn" data-act="leave">В главное меню</button></div>`;
  else if(G.phase==='closed')body=`<div class="pcard"><p class="big-msg">Палата закрыта</p><button class="btn" data-act="leave">В главное меню</button></div>`;
  else if(G.phase==='lobby')body=`<div class="pcard fade"><div class="label">Ты в списке</div><p class="big-msg">Ждём остальных</p><p class="muted">Игра начнётся, когда главврач нажмёт «Начать приём» на большом экране.</p></div>`;
  else if(!me)body=`<div class="pcard"><p class="big-msg">Приём уже идёт</p><p class="muted">Ты присоединишься к следующему заезду. Не закрывай страницу.</p></div>`;
  else body=phoneBody(G,me);
  return `<div class="wrap"><div class="phone">${bar}${body}</div></div>`;
}
function phoneBody(G,me){
  const answered=S.my.lastAct&&S.my.lastAct.s===G.seq;
  const v=answered?S.my.lastAct.v:null;
  const look='<p class="muted">Смотри на большой экран.</p>';
  switch(G.phase){
    case 'intro':return `<div class="pcard fade"><p class="big-msg">Приём начинается</p>${look}<p>${me.alive?'Ты жив. Пока.':'Ты призрак.'}</p></div>`;
    case 'question':
      if(answered)return `<div class="pcard fade"><div class="label">Ответ принят</div><p class="big-msg">${LET[v]}</p><p>${esc(G.q.o[v])}</p>${timerRow()}</div>`;
      return `<div class="pcard">${timerRow()}<p class="pq">${esc(G.q.t)}</p><div class="ans-list">${G.q.o.map((o,i)=>`<button class="ans" data-act="ans:${i}"><span class="let">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
    case 'reveal':{
      const mine=G.rev.picks[S.uid];const ok=mine===G.rev.a;
      return `<div class="pcard fade"><p class="big-msg ${ok?'good':'bad'}">${ok?'Верно, +100':mine==null?'Ты промолчал':'Неверно'}</p><p class="muted">Правильно: ${LET[G.rev.a]} · ${esc(G.q.o[G.rev.a])}</p>${!ok&&me.alive?'<p>Готовься к процедуре.</p>':''}</div>`}
    case 'trialIntro':{
      const inn=G.trial.who.includes(S.uid);
      return `<div class="pcard fade"><div class="label">Процедурная</div><p class="big-msg ${inn?'bad':'good'}">${inn?'Тебя ведут на процедуру':me.alive?'В этот раз пронесло':'Призраку процедуры не страшны'}</p><p><b>${TRIALS[G.trial.type].name}.</b> ${esc(TRIALS[G.trial.type].rule(G.trial))}</p></div>`}
    case 'trial':{
      const t=G.trial;
      if(!t.who.includes(S.uid))return `<div class="pcard"><p class="big-msg">Процедура идёт</p>${look}${timerRow()}</div>`;
      if(t.type==='pills'){
        if(answered)return `<div class="pcard fade"><div class="label">Ты выбрал</div><p class="big-msg">Таблетка №${v+1}</p><p class="muted">Ждём остальных. Глотай.</p>${timerRow()}</div>`;
        return `<div class="pcard">${timerRow()}<p class="pq">Выбери таблетку</p><div class="pills-pick">${Array.from({length:t.k},(_,i)=>`<button class="pillbtn" data-act="pill:${i}"><span class="pill"></span><span class="pill-n">№${i+1}</span></button>`).join('')}</div></div>`;
      }
      if(t.type==='math')return `<div class="pcard">${timerRow()}<div class="mathbox"><div class="label">Решено: <b id="mcount">0</b></div><div class="prob" id="mprob"></div>
        <form class="mform" id="mform" autocomplete="off"><input id="minput" inputmode="numeric" pattern="-?[0-9]*" aria-label="Ответ"><button class="btn">OK</button></form></div></div>`;
      if(t.type==='guess'){
        if(answered)return `<div class="pcard fade"><div class="label">Твой ответ</div><p class="big-msg">${esc(v)}</p><p class="muted">Ждём остальных.</p>${timerRow()}</div>`;
        return `<div class="pcard">${timerRow()}<p class="pq">${esc(t.gt)}</p><form class="mform" id="gform" autocomplete="off"><input id="ginput" inputmode="numeric" pattern="[0-9]*" aria-label="Число"><button class="btn">OK</button></form></div>`;
      }
      return '';
    }
    case 'trialResult':{
      const r=G.tres,inn=G.trial.who.includes(S.uid);
      if(!inn)return `<div class="pcard fade"><p class="big-msg">Итоги процедуры</p>${look}</div>`;
      const died=r.dead.includes(S.uid);
      return `<div class="pcard fade"><p class="big-msg ${died?'bad':'good'}">${died?'Ты умер':'Ты выжил'}</p><p>${died?'Теперь ты призрак. Продолжай отвечать: в финале можно ожить.':r.spared?'Главврач пощадил всех. Повезло.':'Возвращайся в палату.'}</p></div>`}
    case 'finalIntro':return `<div class="pcard fade"><div class="label">Финал</div><p class="big-msg">Побег</p><p>Выход в ${LEN} шагах. Ты стартуешь с клетки ${me.pos}. В каждом вопросе отметь все подходящие варианты и нажми «Готово». Верный вариант даёт шаг, лишний отнимает.</p>${me.alive?'':'<p>Обгони последнего живого, и ты оживёшь.</p>'}</div>`;
    case 'finalQ':
      if(answered)return `<div class="pcard fade"><div class="label">Принято</div><p class="big-msg">${v.length?v.map(i=>LET[i]).join(' + '):'Ничего'}</p><p class="muted">Ждём остальных.</p>${timerRow()}</div>`;
      return `<div class="pcard">${timerRow()}<div class="label">Отметь всё, что подходит</div><p class="pq">${esc(G.fin.t)}</p><div class="ans-list">${G.fin.o.map((o,i)=>`<button class="ans ft ${S.fsel.has(i)?'on':''}" data-act="ft:${i}" aria-pressed="${S.fsel.has(i)}"><span class="let">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><button class="btn big" data-act="fdone">Готово</button></div>`;
    case 'finalReveal':{
      const r=G.frev,mv=r.moves[S.uid]||0;
      return `<div class="pcard fade"><p class="big-msg ${mv?'good':'bad'}">${mv?`+${mv} ${plural(mv,'шаг','шага','шагов')}`:'Ни шагу'}</p><p>Ты на клетке ${me.pos} из ${LEN}.</p>${r.revived.includes(S.uid)?'<p class="big-msg good">Ты ожил!</p>':''}<p class="muted">Верно: ${r.c.map(i=>esc(G.fin.o[i])).join(', ')}</p></div>`}
    case 'over':{
      const w=G.winner;
      return `<div class="pcard fade"><div class="label">Конец заезда</div><p class="big-msg ${w===S.uid?'good':''}">${w===S.uid?'Ты выписан! Победа':w?`Выписан: ${esc(G.P[w].name)}`:'Никто не выбрался'}</p><p class="muted">Жди новый заезд на большом экране.</p></div>`}
  }
  return `<div class="pcard">${look}</div>`;
}

/* ---------- динамика ---------- */
function updateDynamic(){
  const G=cur();
  if(!S.role){
    const st=$('#status');const ok=S.ready&&!S.busy;
    ['#createbtn','#joinbtn'].forEach(s=>{const b=$(s);if(b)b.disabled=!ok});
    if(st){st.className='status'+(S.failed?' bad':'');st.textContent=S.failed?'Не загрузилась библиотека соединений. Обнови страницу.':''}
    return;
  }
  tick();
  if(S.role!=='host')return;
  const P=G.P||{};
  if(G.phase==='lobby'){
    const list=$('#loblist');if(!list)return;
    const ppl=lobbyPeople();
    list.innerHTML=ppl.length?ppl.map((p,i)=>`<div class="lob-row"><span class="tok sm" style="--c:${COLORS[i%COLORS.length]}">${esc(p.name.charAt(0).toUpperCase())}</span><span class="nm">${esc(p.name)}</span>${!p.bot&&!S.conns.has(p.id)?'<span class="label" style="color:var(--amber)">не в сети</span>':''}${p.bot?`<span class="label">бот</span><button class="btn sm ghost" data-act="rmbot:${p.id}" aria-label="Убрать бота">✕</button>`:''}</div>`).join(''):`<div class="empty">${S.playersLoaded?'Пока никого. Вводите код на телефонах.':'Жду ответ хранилища…'}</div>`;
    const c=$('#pcount');if(c)c.textContent=ppl.length?`· ${ppl.length}`:'';
    const sb=$('#startbtn');if(sb)sb.disabled=!ppl.length;
    return;
  }
  const r=$('#roster');
  if(r){
    const coll=COLLECT.has(G.phase),act=new Set(coll?actors():[]);
    r.innerHTML=Object.keys(P).map(id=>{const p=P[id];const done=act.has(id)&&getAct(id);
      return `<span class="rp ${done?'done':''}">${tok(id,P,'sm')}<span class="nm">${esc(p.name)}</span>${!p.bot&&!S.conns.has(id)?'<span class="st" style="color:var(--amber)">нет связи</span>':''}<span class="st">${p.alive?(G.phase.startsWith('final')?`клетка ${p.pos}`:`${p.score}`):'призрак'}</span>${act.has(id)?`<span class="chk">${done?'✓':'…'}</span>`:''}</span>`}).join('');
  }
  if(G.phase==='trial'&&G.trial.type==='math')document.querySelectorAll('[data-mc]').forEach(el=>{const a=getAct(el.dataset.mc);el.textContent=a?a.v:0});
}
function tick(){
  const G=cur();if(!G)return;
  const rem=remaining(),total=(G.dur||1)*1000/TS;
  document.querySelectorAll('[data-timer]').forEach(el=>{el.style.transform=`scaleX(${G.dur?rem/total:0})`;el.classList.toggle('warn',rem*TS<5000)});
  document.querySelectorAll('[data-secs]').forEach(el=>el.textContent=G.dur?Math.ceil(rem*TS/1000):'');
  if(S.role==='player'&&G.dur&&rem<=0){
    const answered=S.my.lastAct&&S.my.lastAct.s===G.seq;
    if(G.phase==='finalQ'&&!answered){send([...S.fsel]);render()}
    if(G.phase==='trial'&&G.trial.who.includes(S.uid)){
      if(G.trial.type==='guess'&&!answered){const i=$('#ginput');if(i&&i.value.trim()!==''&&isFinite(Number(i.value))){send(Number(i.value));render()}}
      if(G.trial.type==='math'){const i=$('#minput');if(i&&!i.disabled){i.disabled=true;i.placeholder='Время вышло'}}
    }
  }
}
setInterval(tick,200);

/* ---------- телефон: действия ---------- */
function newProblem(){
  const m=S.math;const op=pick(['+','−','×']);let a,b,ans;
  if(op==='+'){a=10+rand(80);b=10+rand(80);ans=a+b}
  else if(op==='−'){a=20+rand(80);b=1+rand(a-1);ans=a-b}
  else{a=2+rand(11);b=2+rand(9);ans=a*b}
  Object.assign(m,{a,b,op,ans});showProblem();
}
function showProblem(){const m=S.math;const p=$('#mprob');if(p)p.textContent=`${m.a} ${m.op} ${m.b}`;const c=$('#mcount');if(c)c.textContent=m.count}
function onMath(){
  const i=$('#minput');if(!i||i.disabled||!S.math)return;const val=i.value.trim();if(val==='')return;
  if(Number(val)===S.math.ans){S.math.count++;send(S.math.count)}
  else{const f=$('#mform');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}

/* ---------- сеть: PeerJS (WebRTC), без своего сервера ---------- */
const PREFIX='tihiychas-v1-';
const NET_ERR=['network','server-error','socket-error','socket-closed','disconnected'];
function peerOpts(){const q=new URLSearchParams(location.search);const h=q.get('peerhost');return h?{host:h,port:Number(q.get('peerport')||9000),path:'/',secure:false,debug:0}:{debug:0}}
function getPid(){let p=LS.get('tc-pid');if(!p){p='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);LS.set('tc-pid',p)}return p}
function setNet(ok){S.net=ok;const el=$('#net');if(el){el.hidden=ok}}
async function wake(){try{if(navigator.wakeLock&&!S.wl){S.wl=await navigator.wakeLock.request('screen');S.wl.addEventListener('release',()=>S.wl=null)}}catch(e){}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* хост */
function hostOpen(code){
  return new Promise((res,rej)=>{
    const peer=new Peer(PREFIX+code,peerOpts());let opened=false;
    peer.on('open',()=>{setNet(true);if(!opened){opened=true;res(peer)}});
    peer.on('error',e=>{if(!opened){try{peer.destroy()}catch(_){}rej(e)}else if(NET_ERR.includes(e.type))setNet(false)});
    peer.on('disconnected',()=>{setNet(false);setTimeout(()=>{if(!peer.destroyed&&peer.disconnected)try{peer.reconnect()}catch(_){}},2000)});
    peer.on('connection',hostConn);
  });
}
function hostConn(conn){
  conn.on('data',m=>{
    if(!m||typeof m!=='object'||S.role!=='host')return;
    if(m.t==='join'){
      const pid=String(m.pid||'').slice(0,40);if(!pid)return;
      const name=String(m.name||'').trim().slice(0,16)||'Пациент';
      conn._pid=pid;const old=S.conns.get(pid);if(old&&old!==conn)try{old.close()}catch(_){}
      S.conns.set(pid,conn);
      const ex=S.players[pid];
      S.players[pid]={name:ex&&S.HG.phase!=='lobby'?ex.name:name,joined:ex?ex.joined:Date.now(),act:ex?ex.act:null};
      if(m.act&&typeof m.act==='object')S.players[pid].act=m.act;
      persistHost();sendState(conn);updateDynamic();checkEarly();
    }else if(m.t==='act'&&conn._pid&&S.players[conn._pid]&&m.act&&typeof m.act==='object'&&JSON.stringify(m.act).length<500){
      S.players[conn._pid].act=m.act;persistHost();updateDynamic();checkEarly();
    }
  });
  conn.on('close',()=>{if(S.conns.get(conn._pid)===conn)S.conns.delete(conn._pid);updateDynamic()});
  conn.on('error',()=>{});
}
function sendState(conn){try{if(conn.open)conn.send({t:'state',g:S.HG})}catch(e){}}
function persistHost(){if(S.role==='host')LS.set('tc-host',JSON.stringify({code:S.code,HG:S.HG,players:S.players}))}
async function saveNow(){if(!S.HG)return;S.conns.forEach(sendState);persistHost()}
async function onCreate(){
  if(!S.ready||S.busy)return;S.busy=true;updateDynamic();
  try{
    let code,peer=null;
    for(let i=0;i<8&&!peer;i++){
      code=String(1000+rand(9000));
      try{peer=await hostOpen(code)}catch(e){if(e.type!=='unavailable-id')throw e}
    }
    if(!peer)throw {type:'busy'};
    S.peer=peer;S.role='host';S.code=code;S.players={};S.playersLoaded=true;
    S.HG={code,created:Date.now(),phase:'lobby',seq:1,dur:0,rounds:8,bots:[],P:{},quip:QUIPS.lobby[0]};
    LS.set('tc-role','host');LS.set('tc-code',code);persistHost();wake();render();
  }catch(e){S.role=null;toast(e&&e.type==='busy'?'Не нашёл свободный код, попробуй ещё раз.':'Нет связи с сервером соединений. Проверь интернет.')}
  finally{S.busy=false;updateDynamic()}
}
async function resumeHost(){
  let saved;try{saved=JSON.parse(LS.get('tc-host')||'null')}catch(e){}
  if(!saved||!saved.HG||saved.HG.phase==='closed')return;
  let peer=null;
  for(let i=0;i<6&&!peer;i++){try{peer=await hostOpen(saved.code)}catch(e){if(e.type!=='unavailable-id')return;await sleep(2500)}}
  if(!peer){toast('Старая палата ещё занята. Создай новую игру.');return}
  S.peer=peer;S.role='host';S.code=saved.code;S.HG=saved.HG;S.players=saved.players||{};S.playersLoaded=true;
  if(!['lobby','over'].includes(S.HG.phase)){S.host.t0=Date.now();S.host.ended=false;armTimer();scheduleBots()}
}

/* телефон */
function playerConnect(){
  if(S.role!=='player')return;
  clearTimeout(S.reconT);
  if(!S.peer||S.peer.destroyed){
    const peer=new Peer(peerOpts());S.peer=peer;
    peer.on('open',()=>openConn());
    peer.on('error',e=>{
      if(S.peer!==peer)return;
      if(e.type==='peer-unavailable'){
        if(S.joinWait){S.joinWait.fail('Палаты с таким кодом нет. Проверь код и что большой экран открыт.')}
        else{setNet(false);scheduleReconnect(4000)}
      }else if(NET_ERR.includes(e.type)){setNet(false);scheduleReconnect()}
    });
    peer.on('disconnected',()=>{if(S.peer===peer){setNet(false);scheduleReconnect()}});
  }else if(S.peer.disconnected){try{S.peer.reconnect()}catch(e){S.peer.destroy();S.peer=null;scheduleReconnect(500)}}
  else if(S.peer.open)openConn();
}
function scheduleReconnect(ms=2500){if(S.role!=='player')return;clearTimeout(S.reconT);S.reconT=setTimeout(playerConnect,ms)}
function openConn(){
  if(S.conn)try{S.conn.close()}catch(e){}
  const c=S.peer.connect(PREFIX+S.code,{reliable:true});S.conn=c;
  const t=setTimeout(()=>{if(S.conn===c&&!c.open){try{c.close()}catch(e){}if(S.joinWait)S.joinWait.fail('Не получилось соединиться с большим экраном. Попробуй другую сеть, например Wi-Fi.');else scheduleReconnect()}},15000);
  c.on('open',()=>{clearTimeout(t);setNet(true);c.send({t:'join',pid:S.uid,name:S.my.name,act:S.my.lastAct})});
  c.on('data',m=>{if(m&&m.t==='state')onState(m.g)});
  c.on('close',()=>{clearTimeout(t);if(S.conn===c){S.conn=null;setNet(false);scheduleReconnect()}});
  c.on('error',()=>{});
}
function onState(g){
  if(S.joinWait){S.joinWait.ok();S.joinWait=null}
  if(g&&(!S.G||g.seq!==S.G.seq)){S.seqAt=Date.now();S.fsel=new Set();if(S.math&&S.math.seq!==g.seq)S.math=null}
  S.G=g;render();
}
function send(v){
  const G=S.G;if(!G)return;
  S.my.lastAct={s:G.seq,v};
  try{if(S.conn&&S.conn.open)S.conn.send({t:'act',act:S.my.lastAct})}catch(e){}
}
async function onJoin(){
  if(!S.ready||S.busy)return;
  const code=$('#jcode').value.replace(/\D/g,''),name=$('#jname').value.trim().slice(0,16);
  const err=$('#jerr');
  if(code.length!==4){err.textContent='Код состоит из 4 цифр.';return}
  if(!name){err.textContent='Напиши имя, под которым будешь играть.';return}
  S.busy=true;updateDynamic();err.textContent='Подключаюсь…';
  S.role='player';S.code=code;S.my={name,lastAct:null};S.G=null;
  const r=await new Promise(res=>{S.joinWait={ok:()=>res(null),fail:m=>res(m)};playerConnect()});
  S.joinWait=null;S.busy=false;
  if(r){teardown();S.role=null;render();const e2=$('#jerr');if(e2)e2.textContent=r;updateDynamic();return}
  LS.set('tc-role','player');LS.set('tc-code',code);LS.set('tc-name',name);LS.set('tc-lastcode',code);
  wake();render();
}
function resumePlayer(){
  const code=LS.get('tc-code'),name=LS.get('tc-name');if(!code||!name)return;
  S.role='player';S.code=code;S.my={name,lastAct:null};S.G=null;playerConnect();
}
async function resume(){const role=LS.get('tc-role');if(role==='host')await resumeHost();else if(role==='player')resumePlayer()}
function teardown(){
  clearTimeout(S.reconT);clearTimeout(S.host.timer);clearTimeout(S.host.early);
  try{S.conn&&S.conn.close()}catch(e){}S.conn=null;
  S.conns.forEach(c=>{try{c.close()}catch(e){}});S.conns.clear();
  try{S.peer&&S.peer.destroy()}catch(e){}S.peer=null;
}
function leave(){
  teardown();LS.del('tc-role');LS.del('tc-code');LS.del('tc-host');
  Object.assign(S,{role:null,code:null,G:null,HG:null,players:{},exitArm:false,viewKey:''});render();
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(S.role==='player'&&(!S.conn||!S.conn.open))playerConnect();
  if(S.role==='host'&&S.peer&&S.peer.disconnected)try{S.peer.reconnect()}catch(e){}
  if(S.role)wake();
});
function lobbyQR(){
  try{const url=location.origin+location.pathname+location.search+'#'+S.code;const q=qrcode(0,'M');q.addData(url);q.make();return `<div class="qr">${q.createSvgTag({cellSize:4,margin:2,scalable:true})}</div><p class="muted" style="overflow-wrap:anywhere">${esc(url)}</p>`}catch(e){return ''}
}

function actors(){const G=S.HG;if(G.phase==='trial')return G.trial.who;if(G.phase==='question'||G.phase==='finalQ')return Object.keys(G.P);return[]}
function getAct(id){
  const G=S.HG,p=G.P[id];
  if(p&&p.bot){const b=S.host.botActs[id];return b&&b.s===G.seq?b:null}
  const a=S.players[id]&&S.players[id].act;return a&&a.s===G.seq?a:null;
}
function armTimer(){
  const G=S.HG,seq=G.seq;clearTimeout(S.host.timer);if(!G.dur)return;
  S.host.timer=setTimeout(()=>endPhase(seq),G.dur*1000/TS+(COLLECT.has(G.phase)?1500/TS:0));
}
function go(phase,extra,quipKey,dur){
  const G=S.HG;
  G.phase=phase;G.seq++;G.dur=dur!==undefined?dur:(DUR[phase]||0);
  if(extra)Object.assign(G,extra);
  G.quip=pick(QUIPS[quipKey||phase]||QUIPS.question);
  S.host.t0=Date.now();S.host.botActs={};S.host.ended=false;clearTimeout(S.host.early);
  armTimer();scheduleBots();saveNow();render();
}
function checkEarly(){
  const G=S.HG;if(!G||S.role!=='host'||!COLLECT.has(G.phase)||S.host.ended)return;
  if(G.phase==='trial'&&G.trial.type==='math')return;
  const ids=actors();
  if(ids.length&&ids.every(id=>getAct(id))){const seq=G.seq;clearTimeout(S.host.early);S.host.early=setTimeout(()=>endPhase(seq),900/TS)}
}
function scheduleBots(){
  const G=S.HG,seq=G.seq;
  const bots=actors().filter(id=>G.P[id]&&G.P[id].bot);
  const ms=G.dur*1000/TS;
  bots.forEach(id=>{
    const t=G.phase==='trial'&&G.trial.type==='math'?ms*.85:(.12+Math.random()*.5)*ms;
    setTimeout(()=>{if(S.HG!==G||G.seq!==seq)return;S.host.botActs[id]={s:seq,v:botAnswer(id)};updateDynamic();checkEarly()},t);
  });
}
function botAnswer(){
  const G=S.HG;
  if(G.phase==='question'){const a=dec(G.qa);return Math.random()<.65?a:pick([0,1,2,3].filter(i=>i!==a))}
  if(G.phase==='trial'){const t=G.trial;if(t.type==='pills')return rand(t.k);if(t.type==='math')return 3+rand(9);const a=GUESS[t.gi].a;return Math.round(a*(1+(Math.random()-.5)*.3))}
  if(G.phase==='finalQ'){const c=dec(G.fc);return [0,1,2].filter(i=>c.includes(i)?Math.random()<.75:Math.random()<.25)}
  return null;
}
function pickQuestions(n){
  const kz=shuffle(QUESTIONS.map((q,i)=>q.c==='kz'?i:-1).filter(i=>i>=0)),gen=shuffle(QUESTIONS.map((q,i)=>q.c==='gen'?i:-1).filter(i=>i>=0));
  const out=[];let k=Math.random()<.5;
  while(out.length<n&&(kz.length||gen.length)){const src=k?(kz.length?kz:gen):(gen.length?gen:kz);out.push(src.pop());k=!k}
  return out;
}
function onStart(){
  const G=S.HG,ppl=lobbyPeople();if(!ppl.length)return;
  const P={};ppl.forEach((p,i)=>P[p.id]={name:p.name,alive:true,score:0,pos:0,c:i%COLORS.length,bot:p.bot});
  Object.assign(G,{P,order:pickQuestions(G.rounds),qn:0,tbag:[],gused:[],forder:shuffle(FINALS.map((_,i)=>i)),fn:0,rev:null,doomed:[],trial:null,tres:null,fin:null,frev:null,winner:null});
  go('intro');
}
function nextQuestion(){
  const G=S.HG,q=QUESTIONS[G.order[G.qn]];G.qn++;
  const perm=shuffle([0,1,2,3]);G.qa=enc(perm.indexOf(0));
  go('question',{q:{t:q.t,o:perm.map(i=>q.o[i]),c:q.c},qnote:q.n||'',rev:null,doomed:[],trial:null,tres:null});
}
function afterRound(){
  const G=S.HG;
  if(G.qn<G.rounds&&G.qn<G.order.length)return nextQuestion();
  Object.values(G.P).forEach(p=>p.pos=p.alive?START:0);
  go('finalIntro',{trial:null,tres:null});
}
function startTrial(){
  const G=S.HG,who=G.doomed.slice();
  if(!G.tbag||!G.tbag.length)G.tbag=shuffle(['pills','math','guess']);
  const type=G.tbag.pop(),t={type,who};
  if(type==='pills'){t.k=Math.min(8,Math.max(3,who.length+1));t.np=who.length>=3?2:1;t.x=enc(shuffle([...Array(t.k).keys()]).slice(0,t.np))}
  if(type==='math')t.need=7;
  if(type==='guess'){let pool=GUESS.map((_,i)=>i).filter(i=>!G.gused.includes(i));if(!pool.length){G.gused=[];pool=GUESS.map((_,i)=>i)}const gi=pick(pool);G.gused.push(gi);Object.assign(t,{gi,gt:GUESS[gi].t,tol:GUESS[gi].tol})}
  go('trialIntro',{trial:t,tres:null});
}
function resolveTrial(){
  const G=S.HG,P=G.P,t=G.trial,who=t.who;let dead=[];const detail={},extra={};
  if(t.type==='pills'){const poison=dec(t.x)||[];who.forEach(id=>{const a=getAct(id);const v=a&&Number.isInteger(a.v)?a.v:rand(t.k);detail[id]={v,auto:!a};if(poison.includes(v))dead.push(id)});extra.poison=poison}
  if(t.type==='math'){
    who.forEach(id=>{const a=getAct(id);detail[id]={v:a?(a.v|0):0}});
    const vals=who.map(id=>detail[id].v),min=Math.min(...vals);
    if(who.length===1){if(vals[0]<t.need)dead=[who[0]]}
    else{const tie=vals.every(v=>v===min);dead=who.filter(id=>detail[id].v===min&&(!tie||detail[id].v<t.need))}
  }
  if(t.type==='guess'){
    const ans=GUESS[t.gi].a;extra.ans=ans;
    who.forEach(id=>{const a=getAct(id);const v=a&&isFinite(Number(a.v))?Number(a.v):null;detail[id]={v,d:v===null?null:Math.abs(v-ans)}});
    const D=id=>detail[id].d===null?Infinity:detail[id].d;
    if(who.length===1){if(D(who[0])>t.tol)dead=[who[0]]}
    else{const mx=Math.max(...who.map(D));const tie=who.every(id=>D(id)===mx);dead=who.filter(id=>D(id)===mx&&(!tie||D(id)>t.tol))}
  }
  let spared=false;
  if(dead.length&&!Object.keys(P).some(id=>P[id].alive&&!dead.includes(id))){spared=true;dead=[]}
  dead.forEach(id=>P[id].alive=false);
  go('trialResult',{tres:{dead,detail,spared,...extra}},dead.length?'trialDead':'trialSafe');
}
function nextFinal(){
  const G=S.HG;
  if(G.fn>=G.forder.length)return go('over',{winner:furthestAlive()},'over',0);
  const f=FINALS[G.forder[G.fn]];G.fn++;
  const perm=shuffle([0,1,2]);G.fc=enc(f.c.map(i=>perm.indexOf(i)).sort());
  go('finalQ',{fin:{t:f.t,o:perm.map(i=>f.o[i])},frev:null});
}
function furthestAlive(){const P=S.HG.P;const a=Object.keys(P).filter(id=>P[id].alive).sort((x,y)=>P[y].pos-P[x].pos||P[y].score-P[x].score);return a[0]||null}
function resolveFinal(){
  const G=S.HG,P=G.P,ids=Object.keys(P),c=dec(G.fc)||[],picks={},moves={},revived=[];
  ids.forEach(id=>{const a=getAct(id);const sel=a&&Array.isArray(a.v)?[...new Set(a.v.filter(i=>Number.isInteger(i)&&i>=0&&i<3))]:[];picks[id]=sel;
    let d=0;sel.forEach(i=>d+=c.includes(i)?1:-1);d=Math.max(0,d);const before=P[id].pos;P[id].pos=Math.min(LEN,before+d);moves[id]=P[id].pos-before});
  const alive=ids.filter(id=>P[id].alive);
  if(alive.length){const minA=Math.min(...alive.map(id=>P[id].pos));ids.filter(id=>!P[id].alive).forEach(id=>{if(P[id].pos>minA){P[id].alive=true;revived.push(id)}})}
  const done=ids.filter(id=>P[id].alive&&P[id].pos>=LEN).sort((a,b)=>P[b].score-P[a].score);
  const win=done[0]||null;
  go('finalReveal',{frev:{c,picks,moves,revived,win}},win?'finalWin':'finalReveal');
}
function endPhase(seq){
  const G=S.HG;if(!G||seq!==G.seq||S.host.ended)return;
  S.host.ended=true;clearTimeout(S.host.timer);clearTimeout(S.host.early);
  const P=G.P;
  switch(G.phase){
    case 'intro':return nextQuestion();
    case 'question':{
      const a=dec(G.qa),picks={},doomed=[];
      Object.keys(P).forEach(id=>{const x=getAct(id);const v=x&&Number.isInteger(x.v)?x.v:null;picks[id]=v;if(v===a)P[id].score+=100;else if(P[id].alive)doomed.push(id)});
      return go('reveal',{rev:{a,picks,note:G.qnote},doomed},doomed.length?'revealSome':'revealAll');
    }
    case 'reveal':return G.doomed.length?startTrial():afterRound();
    case 'trialIntro':return go('trial',{},'trial',TRIAL_DUR[G.trial.type]);
    case 'trial':return resolveTrial();
    case 'trialResult':return afterRound();
    case 'finalIntro':return nextFinal();
    case 'finalQ':return resolveFinal();
    case 'finalReveal':return G.frev.win?go('over',{winner:G.frev.win},'over',0):nextFinal();
  }
}

/* ---------- события ---------- */
const H={
  create:onCreate,
  start:onStart,
  addbot(){const G=S.HG;G.bots=G.bots||[];if(lobbyPeople().length>=10){toast('В палате максимум 10 пациентов.');return}const used=new Set(G.bots.map(b=>b.name));const nm=BOT_NAMES.find(n=>!used.has(n))||'Бот';G.bots.push({id:'bot-'+Date.now().toString(36),name:nm});saveNow();updateDynamic()},
  rmbot(id){const G=S.HG;G.bots=(G.bots||[]).filter(b=>b.id!==id);saveNow();updateDynamic()},
  again(){const G=S.HG;Object.assign(G,{P:{},rev:null,trial:null,tres:null,fin:null,frev:null,winner:null});go('lobby',{},'lobby',0)},
  exit(){
    if(!S.exitArm){S.exitArm=true;render();setTimeout(()=>{if(S.exitArm){S.exitArm=false;render()}},4000);return}
    S.exitArm=false;
    if(S.role==='host'){S.HG.phase='closed';S.HG.seq++;saveNow();setTimeout(leave,600)}else leave();
  },
  leave,
  ans(i){const G=S.G;if(!G||G.phase!=='question'||(S.my.lastAct&&S.my.lastAct.s===G.seq))return;send(Number(i));render()},
  pill(i){const G=S.G;if(!G||G.phase!=='trial'||(S.my.lastAct&&S.my.lastAct.s===G.seq))return;send(Number(i));render()},
  ft(i,b){i=Number(i);if(S.fsel.has(i))S.fsel.delete(i);else S.fsel.add(i);b.classList.toggle('on',S.fsel.has(i));b.setAttribute('aria-pressed',S.fsel.has(i))},
  fdone(){const G=S.G;if(!G||G.phase!=='finalQ'||(S.my.lastAct&&S.my.lastAct.s===G.seq))return;send([...S.fsel]);render()},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();const [a,arg]=b.dataset.act.split(':');H[a]&&H[a](arg,b)});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='joinform')onJoin();else if(id==='mform')onMath();else if(id==='gform')onGuess()});
document.addEventListener('change',e=>{if(e.target.id==='rounds'&&S.HG){S.HG.rounds=Number(e.target.value);saveNow()}});
document.addEventListener('input',e=>{if(e.target.id==='jcode')e.target.value=e.target.value.replace(/\D/g,'').slice(0,4)});

/* ---------- запуск ---------- */
render();
(async()=>{
  if(typeof Peer!=='function'){S.failed=true;updateDynamic();return}
  S.uid=getPid();S.ready=true;updateDynamic();
  await resume();
  render();
})();
</script>
